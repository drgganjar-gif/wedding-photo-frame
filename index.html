<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganjar & Puteri | 31.08.2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  background: #f3edf5;
  font-family: Georgia, serif;
  text-align: center;
  color: #382d3d;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
  letter-spacing: 2px;
}

.subtitle {
  margin-bottom: 16px;
  font-size: 14px;
  letter-spacing: 1px;
}

.camera-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 9 / 16;
  margin: auto;
  background: #111;
  overflow: hidden;
  border-radius: 18px;
  box-shadow: 0 8px 28px rgba(60, 30, 70, 0.25);
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* =========================
   FLORAL FRAME
========================= */

.frame {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

/* Border */

.frame::after {
  content: "";
  position: absolute;
  inset: 12px;
  border: 2px solid rgba(255,255,255,0.85);
  border-radius: 14px;
  box-shadow:
    inset 0 0 0 1px rgba(117,62,139,0.55);
}

/* =========================
   FLORAL TOP LEFT
========================= */

.flower-tl {
  position: absolute;
  top: -25px;
  left: -25px;
  width: 170px;
  height: 170px;
}

.flower-tl::before {
  content: "🌸💜🌿💐";
  position: absolute;
  font-size: 45px;
  line-height: 1.05;
  transform: rotate(-18deg);
  filter: saturate(1.4);
}

/* =========================
   FLORAL TOP RIGHT
========================= */

.flower-tr {
  position: absolute;
  top: -20px;
  right: -20px;
  width: 180px;
  height: 180px;
}

.flower-tr::before {
  content: "💜🌸💐🌿";
  position: absolute;
  right: 0;
  font-size: 44px;
  line-height: 1.05;
  transform: rotate(18deg);
  filter: saturate(1.4);
}

/* =========================
   FLORAL BOTTOM LEFT
========================= */

.flower-bl {
  position: absolute;
  bottom: -25px;
  left: -25px;
  width: 190px;
  height: 190px;
}

.flower-bl::before {
  content: "🌿💐💜🌸";
  position: absolute;
  bottom: 0;
  font-size: 46px;
  line-height: 1.05;
  transform: rotate(12deg);
  filter: saturate(1.4);
}

/* =========================
   FLORAL BOTTOM RIGHT
========================= */

.flower-br {
  position: absolute;
  bottom: -25px;
  right: -25px;
  width: 190px;
  height: 190px;
}

.flower-br::before {
  content: "🌸💜💐🌿";
  position: absolute;
  right: 0;
  bottom: 0;
  font-size: 46px;
  line-height: 1.05;
  transform: rotate(-12deg);
  filter: saturate(1.4);
}

/* =========================
   EXTRA FLOWERS
========================= */

.extra {
  position: absolute;
  font-size: 25px;
  opacity: 0.9;
}

.e1 {
  top: 110px;
  left: 8px;
}

.e2 {
  top: 145px;
  right: 8px;
}

.e3 {
  bottom: 145px;
  left: 8px;
}

.e4 {
  bottom: 110px;
  right: 8px;
}

/* =========================
   TEXT
========================= */

.wedding-text {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 38px;

  padding: 55px 20px 30px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(255,255,255,0.15) 15%,
      rgba(255,255,255,0.88) 55%,
      rgba(255,255,255,0.94)
    );
}

.wedding {
  font-size: 11px;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.names {
  font-size: 31px;
  letter-spacing: 1px;
  color: #573365;
  text-shadow: 0 1px 2px rgba(255,255,255,0.8);
}

.date {
  margin-top: 8px;
  font-size: 14px;
  letter-spacing: 4px;
  color: #684575;
}

/* =========================
   BUTTONS
========================= */

button {
  width: 100%;
  max-width: 420px;
  margin: 12px auto 0;
  padding: 14px;
  border: none;
  border-radius: 11px;

  background: #684575;
  color: white;

  font-size: 15px;
  cursor: pointer;

  box-shadow: 0 4px 12px rgba(80,40,90,0.2);
}

button:active {
  transform: scale(0.98);
}

/* switch camera */

#switchCamera {
  position: absolute;
  top: 24px;
  right: 24px;

  z-index: 20;

  width: 46px;
  height: 46px;

  margin: 0;
  padding: 0;
  border-radius: 50%;

  background: rgba(65,35,75,0.65);

  font-size: 20px;
}

/* countdown */

#countdown {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  z-index: 30;

  font-size: 90px;
  font-weight: bold;

  color: white;

  text-shadow: 0 3px 15px #3b1748;

  display: none;
}

/* result */

#result {
  display: none;
  width: 100%;
  max-width: 420px;
  margin: 20px auto;
}

#result img {
  width: 100%;
  border-radius: 16px;
  box-shadow: 0 6px 22px rgba(60,30,70,0.22);
}
</style>
</head>

<body>

<h1>Wedding Photo</h1>

<div class="subtitle">
Ganjar & Puteri • 31.08.2026
</div>

<div class="camera-box">

  <video id="camera" autoplay playsinline></video>

  <button id="switchCamera">🔄</button>

  <div id="countdown"></div>

  <div class="frame">

    <div class="flower-tl"></div>
    <div class="flower-tr"></div>
    <div class="flower-bl"></div>
    <div class="flower-br"></div>

    <div class="extra e1">💜🌿</div>
    <div class="extra e2">🌸💜</div>
    <div class="extra e3">💐🌿</div>
    <div class="extra e4">💜🌸</div>

    <div class="wedding-text">

      <div class="wedding">
        THE WEDDING OF
      </div>

      <div class="names">
        Ganjar & Puteri
      </div>

      <div class="date">
        31 • 08 • 2026
      </div>

    </div>

  </div>

</div>

<button id="takePhoto">
📸 AMBIL FOTO
</button>

<div id="result">

  <img id="photoResult">

  <button id="download">
    ⬇️ DOWNLOAD FOTO
  </button>

  <button id="retake">
    🔄 FOTO ULANG
  </button>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

const video =
document.getElementById("camera");

const takePhoto =
document.getElementById("takePhoto");

const switchCamera =
document.getElementById("switchCamera");

const countdown =
document.getElementById("countdown");

const canvas =
document.getElementById("canvas");

const result =
document.getElementById("result");

const photoResult =
document.getElementById("photoResult");

const download =
document.getElementById("download");

const retake =
document.getElementById("retake");

let stream;

let facingMode = "user";


async function startCamera() {

  try {

    if (stream) {

      stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: facingMode
        },

        audio: false

      });

    video.srcObject = stream;

  }

  catch(error) {

    alert(
      "Kamera tidak dapat digunakan. Silakan izinkan akses kamera."
    );

  }

}


window.addEventListener(
  "load",
  startCamera
);


switchCamera.onclick =
async function() {

  facingMode =
    facingMode === "user"
    ? "environment"
    : "user";

  await startCamera();

};


takePhoto.onclick =
function() {

  let number = 3;

  countdown.style.display =
    "block";

  countdown.innerText =
    number;

  const timer =
    setInterval(function() {

      number--;

      if(number > 0) {

        countdown.innerText =
          number;

      }

      else {

        clearInterval(timer);

        countdown.innerText =
          "📸";

        setTimeout(
          capturePhoto,
          300
        );

      }

    }, 1000);

};


function capturePhoto() {

  countdown.style.display =
    "none";

  const width = 1080;
  const height = 1920;

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  const scale =
    Math.max(
      width / video.videoWidth,
      height / video.videoHeight
    );

  const newWidth =
    video.videoWidth * scale;

  const newHeight =
    video.videoHeight * scale;

  const x =
    (width - newWidth) / 2;

  const y =
    (height - newHeight) / 2;

  ctx.drawImage(
    video,
    x,
    y,
    newWidth,
    newHeight
  );


  /* GRADIENT */

  const gradient =
    ctx.createLinearGradient(
      0,
      1200,
      0,
      1920
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );
  gradient.addColorStop(
    1,
    "rgba(255,255,255,0.92)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    1050,
    width,
    870
  );


  /* TEXT */

  ctx.fillStyle =
    "#573365";

  ctx.textAlign =
    "center";

  ctx.font =
    "24px Georgia";

  ctx.fillText(
    "THE WEDDING OF",
    540,
    1635
  );

  ctx.font =
    "52px Georgia";

  ctx.fillText(
    "Ganjar & Puteri",
    540,
    1710
  );

  ctx.font =
    "25px Georgia";

  ctx.fillText(
    "31 • 08 • 2026",
    540,
    1765
  );


  /* SIMPLE FLORAL DECOR */

  ctx.font = "65px serif";

  ctx.fillText(
    "💜",
    100,
    120
  );

  ctx.fillText(
    "🌸",
    970,
    120
  );

  ctx.fillText(
    "💐",
    100,
    1820
  );

  ctx.fillText(
    "🌸",
    970,
    1820
  );


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );

  photoResult.src =
    image;

  result.style.display =
    "block";

  takePhoto.style.display =
    "none";


  if(stream) {

    stream
    .getTracks()
    .forEach(
      track => track.stop()
    );

  }

}


download.onclick =
function() {

  const link =
    document.createElement("a");

  link.download =
    "Ganjar-Puteri-31082026.jpg";

  link.href =
    photoResult.src;

  link.click();

};


retake.onclick =
async function() {

  result.style.display =
    "none";

  takePhoto.style.display =
    "block";

  await startCamera();

};

</script>

</body>
</html>
