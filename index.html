<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ganjar & Puteri | 31.08.2026</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 18px;

  min-height: 100vh;

  background: #f3edf5;

  font-family: Georgia, serif;

  text-align: center;

  color: #382d3d;

}


h1 {

  margin: 5px 0;

  font-size: 25px;

  letter-spacing: 2px;

}


.subtitle {

  margin-bottom: 16px;

  font-size: 14px;

  letter-spacing: 1px;

}


/* =========================
   FRAME SELECTOR
========================= */

.frame-title {

  margin-top: 10px;

  margin-bottom: 10px;

  font-size: 14px;

  letter-spacing: 1px;

}


.frame-buttons {

  display: flex;

  justify-content: center;

  gap: 7px;

  width: 100%;

  max-width: 420px;

  margin: 0 auto 15px;

}


.frame-button {

  flex: 1;

  width: auto;

  margin: 0;

  padding: 11px 4px;

  border-radius: 10px;

  background: white;

  color: #684575;

  border: 2px solid #d9c8df;

  box-shadow: none;

  font-size: 12px;

  cursor: pointer;

}


.frame-button.active {

  background: #684575;

  color: white;

  border-color: #684575;

}


/* =========================
   CAMERA
========================= */

.camera-box {

  position: relative;

  width: 100%;

  max-width: 420px;

  aspect-ratio: 9 / 16;

  margin: auto;

  background: #111;

  overflow: hidden;

  border-radius: 18px;

  box-shadow:
    0 8px 28px rgba(60,30,70,0.25);

}


#camera {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  z-index: 1;

}


#frameOverlay {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: fill;

  z-index: 10;

  pointer-events: none;

}


/* =========================
   SWITCH CAMERA
========================= */

#switchCamera {

  position: absolute;

  top: 24px;

  right: 24px;

  z-index: 20;

  width: 46px;

  height: 46px;

  margin: 0;

  padding: 0;

  border: none;

  border-radius: 50%;

  background:
    rgba(65,35,75,0.65);

  color: white;

  font-size: 20px;

  cursor: pointer;

}


/* =========================
   COUNTDOWN
========================= */

#countdown {

  position: absolute;

  top: 50%;

  left: 50%;

  transform:
    translate(-50%,-50%);

  z-index: 30;

  font-size: 90px;

  font-weight: bold;

  color: white;

  text-shadow:
    0 3px 15px #3b1748;

  display: none;

}


/* =========================
   BUTTON
========================= */

button {

  width: 100%;

  max-width: 420px;

  margin: 12px auto 0;

  padding: 14px;

  border: none;

  border-radius: 11px;

  background: #684575;

  color: white;

  font-size: 15px;

  cursor: pointer;

  box-shadow:
    0 4px 12px rgba(80,40,90,0.2);

}


button:active {

  transform: scale(0.98);

}


/* =========================
   RESULT
========================= */

#result {

  display: none;

  width: 100%;

  max-width: 420px;

  margin: 20px auto;

}


#photoResult {

  width: 100%;

  border-radius: 16px;

  box-shadow:
    0 6px 22px rgba(60,30,70,0.22);

}


/* =========================
   CAPTION
========================= */

.caption-box {

  display: none;

  width: 100%;

  max-width: 420px;

  margin: 18px auto 0;

}


.caption-title {

  margin-bottom: 8px;

  font-size: 14px;

  letter-spacing: 1px;

}


#captionInput {

  width: 100%;

  min-height: 90px;

  padding: 13px;

  resize: vertical;

  border: 1px solid #d6c5dc;

  border-radius: 11px;

  background: white;

  color: #382d3d;

  font-family: Georgia, serif;

  font-size: 14px;

  outline: none;

}


#captionInput:focus {

  border-color: #684575;

}


.caption-counter {

  text-align: right;

  margin-top: 5px;

  font-size: 11px;

  color: #806d86;

}


#applyCaption {

  margin-top: 10px;

}


/* =========================
   RESOLUTION
========================= */

#resolutionInfo {

  margin-top: 8px;

  font-size: 11px;

  color: #806d86;

}


/* =========================
   CANVAS
========================= */

#canvas {

  display: none;

}

</style>

</head>


<body>


<h1>
Wedding Photo
</h1>


<div class="subtitle">
Ganjar & Puteri • 31.08.2026
</div>


<div class="frame-title">
Pilih Frame
</div>


<div class="frame-buttons">


<button
  class="frame-button active"
  id="frame1Button">

🌸 Frame 1

</button>


<button
  class="frame-button"
  id="frame2Button">

💜 Frame 2

</button>


<button
  class="frame-button"
  id="frame3Button">

🌿 Frame 3

</button>


<button
  class="frame-button"
  id="frame4Button">

✨ Frame 4

</button>


</div>


<div class="camera-box">


<video
  id="camera"
  autoplay
  playsinline>
</video>


<img
  id="frameOverlay"
  src="frame01.png"
  alt="Wedding Frame">


<button
  id="switchCamera">

🔄

</button>


<div id="countdown"></div>


</div>


<div id="resolutionInfo">
Memuat kamera...
</div>


<button id="takePhoto">

📸 AMBIL FOTO

</button>


<!-- =========================
     CAPTION
========================= -->

<div
  class="caption-box"
  id="captionBox">


<div class="caption-title">

💌 Tulis pesan untuk Ganjar & Puteri

</div>


<textarea
  id="captionInput"
  maxlength="120"
  placeholder="Contoh: Semoga bahagia selalu dan menjadi keluarga yang sakinah 🤍">
</textarea>


<div class="caption-counter">

<span id="captionCounter">0</span>
/
120

</div>


<button id="applyCaption">

💌 TAMBAHKAN PESAN KE FOTO

</button>


</div>


<!-- =========================
     RESULT
========================= -->

<div id="result">


<img
  id="photoResult"
  alt="Hasil foto">


<button id="download">

⬇️ DOWNLOAD FOTO

</button>


<button id="share">

📸 POST TO INSTAGRAM STORY

</button>


<button id="retake">

🔄 FOTO ULANG

</button>


</div>


<canvas id="canvas"></canvas>


<script>


/* =========================
   ELEMENT
========================= */

const video =
  document.getElementById("camera");


const takePhoto =
  document.getElementById("takePhoto");


const switchCamera =
  document.getElementById("switchCamera");


const countdown =
  document.getElementById("countdown");


const canvas =
  document.getElementById("canvas");


const result =
  document.getElementById("result");


const photoResult =
  document.getElementById("photoResult");


const download =
  document.getElementById("download");


const share =
  document.getElementById("share");


const retake =
  document.getElementById("retake");


const frameOverlay =
  document.getElementById("frameOverlay");


const resolutionInfo =
  document.getElementById("resolutionInfo");


const captionBox =
  document.getElementById("captionBox");


const captionInput =
  document.getElementById("captionInput");


const captionCounter =
  document.getElementById("captionCounter");


const applyCaption =
  document.getElementById("applyCaption");


const frame1Button =
  document.getElementById("frame1Button");


const frame2Button =
  document.getElementById("frame2Button");


const frame3Button =
  document.getElementById("frame3Button");


const frame4Button =
  document.getElementById("frame4Button");


/* =========================
   CAMERA
========================= */

let stream = null;

let facingMode = "user";


/* =========================
   FRAME
========================= */

let selectedFrame =
  "frame01.png";


/* =========================
   FRAME SELECTOR
========================= */

frame1Button.onclick =
function() {

  selectedFrame =
    "frame01.png";

  frameOverlay.src =
    selectedFrame;

  frame1Button.classList.add(
    "active"
  );

  frame2Button.classList.remove(
    "active"
  );

  frame3Button.classList.remove(
    "active"
  );

  frame4Button.classList.remove(
    "active"
  );

};


frame2Button.onclick =
function() {

  selectedFrame =
    "frame02.png";

  frameOverlay.src =
    selectedFrame;

  frame2Button.classList.add(
    "active"
  );

  frame1Button.classList.remove(
    "active"
  );

  frame3Button.classList.remove(
    "active"
  );

  frame4Button.classList.remove(
    "active"
  );

};


frame3Button.onclick =
function() {

  selectedFrame =
    "frame03.png";

  frameOverlay.src =
    selectedFrame;

  frame3Button.classList.add(
    "active"
  );

  frame1Button.classList.remove(
    "active"
  );

  frame2Button.classList.remove(
    "active"
  );

  frame4Button.classList.remove(
    "active"
  );

};


frame4Button.onclick =
function() {

  selectedFrame =
    "frame04.png";

  frameOverlay.src =
    selectedFrame;

  frame4Button.classList.add(
    "active"
  );

  frame1Button.classList.remove(
    "active"
  );

  frame2Button.classList.remove(
    "active"
  );

  frame3Button.classList.remove(
    "active"
  );

};


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            facingMode,

          width: {
            ideal: 3840
          },

          height: {
            ideal: 2160
          },

          frameRate: {
            ideal: 30
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    resolutionInfo.innerText =
      "Kamera: " +
      video.videoWidth +
      " × " +
      video.videoHeight;


  }

  catch(error) {

    console.error(error);

    alert(
      "Kamera tidak dapat digunakan. Silakan izinkan akses kamera."
    );

  }

}


/* =========================
   LOAD
========================= */

window.addEventListener(
  "load",
  startCamera
);


/* =========================
   SWITCH CAMERA
========================= */

switchCamera.onclick =
async function() {

  facingMode =
    facingMode === "user"
      ? "environment"
      : "user";

  await startCamera();

};


/* =========================
   AMBIL FOTO
========================= */

takePhoto.onclick =
function() {

  let number = 3;


  countdown.style.display =
    "block";


  countdown.innerText =
    number;


  const timer =
    setInterval(function() {

      number--;


      if (number > 0) {

        countdown.innerText =
          number;

      }

      else {

        clearInterval(timer);

        countdown.innerText =
          "📸";


        setTimeout(
          capturePhoto,
          300
        );

      }

    },1000);

};


/* =========================
   CAPTURE FOTO
========================= */

function capturePhoto() {


  countdown.style.display =
    "none";


  const sourceWidth =
    video.videoWidth;


  const sourceHeight =
    video.videoHeight;


  const targetRatio =
    9 / 16;


  let cropWidth =
    sourceWidth;


  let cropHeight =
    sourceWidth /
    targetRatio;


  if (
    cropHeight >
    sourceHeight
  ) {

    cropHeight =
      sourceHeight;


    cropWidth =
      sourceHeight *
      targetRatio;

  }


  const cropX =
    (
      sourceWidth -
      cropWidth
    ) / 2;


  const cropY =
    (
      sourceHeight -
      cropHeight
    ) / 2;


  const outputWidth =
    Math.round(cropWidth);


  const outputHeight =
    Math.round(cropHeight);


  canvas.width =
    outputWidth;


  canvas.height =
    outputHeight;


  const ctx =
    canvas.getContext("2d");


  /* CAMERA */

  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    outputWidth,
    outputHeight

  );


  /* FRAME */

  const frame =
    new Image();


  frame.onload =
  function() {


    ctx.drawImage(

      frame,

      0,
      0,

      outputWidth,
      outputHeight

    );


    finishPhoto();

  };


  frame.onerror =
  function() {

    alert(
      "Frame tidak ditemukan. Pastikan file frame berada satu folder dengan index.html."
    );

  };


  frame.src =
    selectedFrame;

}


/* =========================
   FINISH FOTO
========================= */

function finishPhoto() {


  const image =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  photoResult.src =
    image;


  result.style.display =
    "block";


  captionBox.style.display =
    "block";


  takePhoto.style.display =
    "none";


  captionInput.value =
    "";


  captionCounter.innerText =
    "0";


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

}


/* =========================
   COUNTER
========================= */

captionInput.addEventListener(
  "input",
  function() {

    captionCounter.innerText =
      captionInput.value.length;

  }
);


/* =========================
   TAMBAHKAN CAPTION
========================= */

applyCaption.onclick =
function() {


  const caption =
    captionInput.value.trim();


  if (!caption) {

    alert(
      "Silakan tulis pesan terlebih dahulu."
    );

    return;

  }


  const oldCanvas =
    document.createElement("canvas");


  oldCanvas.width =
    canvas.width;


  oldCanvas.height =
    canvas.height;


  const oldCtx =
    oldCanvas.getContext("2d");


  oldCtx.drawImage(
    canvas,
    0,
    0
  );


  /* =========================
     AREA CAPTION
  ========================= */

  const captionHeight =
    Math.round(
      canvas.width * 0.20
    );


  const finalCanvas =
    document.createElement("canvas");


  finalCanvas.width =
    canvas.width;


  finalCanvas.height =
    canvas.height +
    captionHeight;


  const ctx =
    finalCanvas.getContext("2d");


  /* BACKGROUND */

  ctx.fillStyle =
    "#fffafc";


  ctx.fillRect(

    0,
    0,

    finalCanvas.width,
    finalCanvas.height

  );


  /* FOTO */

  ctx.drawImage(

    oldCanvas,

    0,
    0

  );


  /* GARIS PEMBATAS */

  ctx.strokeStyle =
    "#d8c5dc";


  ctx.lineWidth =
    2;


  ctx.beginPath();


  ctx.moveTo(

    40,
    canvas.height +
    10

  );


  ctx.lineTo(

    canvas.width - 40,
    canvas.height +
    10

  );


  ctx.stroke();


  /* JUDUL */

  ctx.fillStyle =
    "#684575";


  ctx.textAlign =
    "center";


  ctx.font =
    "bold " +
    Math.round(
      canvas.width * 0.030
    ) +
    "px Georgia";


  ctx.fillText(

    "A little note for Ganjar & Puteri",

    canvas.width / 2,

    canvas.height +
    Math.round(
      captionHeight * 0.36
    )

  );


  /* CAPTION */

  ctx.font =
    Math.round(
      canvas.width * 0.026
    ) +
    "px Georgia";


  ctx.fillStyle =
    "#382d3d";


  const maxWidth =
    canvas.width -
    100;


  const words =
    caption.split(" ");


  let line =
    "";


  let lines =
    [];


  for (
    let i = 0;
    i < words.length;
    i++
  ) {


    const testLine =
      line +
      words[i] +
      " ";


    const metrics =
      ctx.measureText(
        testLine
      );


    if (
      metrics.width >
      maxWidth &&
      line !== ""
    ) {

      lines.push(
        line.trim()
      );


      line =
        words[i] +
        " ";

    }

    else {

      line =
        testLine;

    }

  }


  lines.push(
    line.trim()
  );


  const lineHeight =
    Math.round(
      canvas.width * 0.035
    );


  const startY =
    canvas.height +
    Math.round(
      captionHeight * 0.58
    );


  lines
    .slice(0,3)
    .forEach(
      (text,index) => {

        ctx.fillText(

          text,

          canvas.width / 2,

          startY +
          (
            index *
            lineHeight
          )

        );

      }
    );


  /* =========================
     UPDATE CANVAS
  ========================= */

  canvas.width =
    finalCanvas.width;


  canvas.height =
    finalCanvas.height;


  const finalCtx =
    canvas.getContext("2d");


  finalCtx.drawImage(
    finalCanvas,
    0,
    0
  );


  /* UPDATE PREVIEW */

  photoResult.src =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  applyCaption.innerText =
    "✅ PESAN SUDAH DITAMBAHKAN";


  setTimeout(
    function() {

      applyCaption.innerText =
        "💌 TAMBAHKAN PESAN KE FOTO";

    },
    2000
  );

};


/* =========================
   DOWNLOAD
========================= */

download.onclick =
function() {


  const link =
    document.createElement("a");


  link.download =
    "Ganjar-Puteri-31082026-HD.jpg";


  link.href =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  link.click();

};


/* =========================
   INSTAGRAM STORY
========================= */

share.onclick =
async function() {


  try {


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(

            resolve,

            "image/jpeg",

            1.0

          );

        }
      );


    const file =
      new File(

        [blob],

        "Ganjar-Puteri-31082026.jpg",

        {
          type:
            "image/jpeg"
        }

      );


    if (

      navigator.canShare &&

      navigator.canShare({

        files: [file]

      })

    ) {


      await navigator.share({

        files: [file],

        title:
          "Ganjar & Puteri",

        text:
          "Wedding Photo • 31.08.2026"

      });


    }

    else {


      alert(
        "Perangkat ini belum mendukung fitur berbagi foto. Silakan download foto terlebih dahulu."
      );

    }


  }

  catch(error) {

    console.log(error);

  }

};


/* =========================
   FOTO ULANG
========================= */

retake.onclick =
async function() {


  result.style.display =
    "none";


  captionBox.style.display =
    "none";


  takePhoto.style.display =
    "block";


  await startCamera();

};


</script>

</body>
</html>
