<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ginanjar & Puteri | 31.08.2026</title>


<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  padding: 24px 16px 40px;

  background:
    radial-gradient(
      circle at top,
      #fffdfd 0%,
      #f8f1f8 45%,
      #eee4ef 100%
    );

  color: #3d3042;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  text-align: center;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  max-width: 500px;

  margin: 0 auto 22px;

}


.small-title {

  margin-bottom: 8px;

  font-family:
    Arial,
    sans-serif;

  font-size: 10px;

  letter-spacing: 4px;

  color: #8a738d;

  text-transform: uppercase;

}


.names {

  margin: 0;

  font-size: 29px;

  font-weight: normal;

  letter-spacing: 2px;

  color: #4b3651;

}


.date {

  margin-top: 8px;

  font-family:
    Arial,
    sans-serif;

  font-size: 11px;

  letter-spacing: 3px;

  color: #806d86;

}


.divider {

  width: 55px;

  height: 1px;

  margin: 15px auto 0;

  background: #bba8bf;

}


/* =====================================================
   CAMERA CARD
===================================================== */

.camera-wrapper {

  width: 100%;

  max-width: 430px;

  margin: 0 auto;

}


.camera-box {

  position: relative;

  width: 100%;

  aspect-ratio: 9 / 16;

  overflow: hidden;

  background: #111;

  border-radius: 20px;

  box-shadow:
    0 15px 40px
    rgba(65, 40, 70, 0.20);

}


#camera {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: cover;

  z-index: 1;

}


#frameOverlay {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  object-fit: fill;

  z-index: 10;

  pointer-events: none;

}


/* =====================================================
   CAMERA SWITCH
===================================================== */

#switchCamera {

  position: absolute;

  top: 18px;

  right: 18px;

  z-index: 30;

  width: 42px;

  height: 42px;

  margin: 0;

  padding: 0;

  border: 1px solid
    rgba(255,255,255,0.5);

  border-radius: 50%;

  background:
    rgba(50,35,55,0.55);

  color: white;

  font-size: 18px;

  backdrop-filter:
    blur(5px);

}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown {

  position: absolute;

  top: 50%;

  left: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 40;

  display: none;

  font-family:
    Georgia,
    serif;

  font-size: 90px;

  font-weight: bold;

  color: white;

  text-shadow:
    0 3px 20px
    rgba(40,20,50,0.8);

}


/* =====================================================
   CAMERA INFO
===================================================== */

#resolutionInfo {

  margin: 10px 0 0;

  font-family:
    Arial,
    sans-serif;

  font-size: 10px;

  letter-spacing: 1px;

  color: #99889c;

}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-label {

  margin:

    24px auto 12px;

  font-family:
    Arial,
    sans-serif;

  font-size: 10px;

  letter-spacing: 3px;

  color: #806d86;

  text-transform: uppercase;

}


/* =====================================================
   FRAME SELECTOR
===================================================== */

.frame-selector {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 9px;

  width: 100%;

  max-width: 430px;

  margin: 0 auto;

}


.frame-choice {

  position: relative;

  padding: 4px;

  border: 1px solid
    #d8cadb;

  border-radius: 10px;

  background: rgba(255,255,255,0.75);

  cursor: pointer;

  transition:
    transform .2s ease,
    border .2s ease,
    box-shadow .2s ease;

}


.frame-choice:hover {

  transform:
    translateY(-2px);

}


.frame-choice.active {

  border: 2px solid
    #76527f;

  box-shadow:
    0 5px 16px
    rgba(100,60,110,0.18);

}


.frame-choice img {

  display: block;

  width: 100%;

  aspect-ratio: 9 / 16;

  object-fit: cover;

  border-radius: 7px;

}


.frame-number {

  position: absolute;

  bottom: 7px;

  left: 50%;

  transform:
    translateX(-50%);

  padding: 3px 7px;

  border-radius: 20px;

  background:
    rgba(60,40,65,0.72);

  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 8px;

  letter-spacing: 1px;

}


.selected-mark {

  position: absolute;

  top: 7px;

  right: 7px;

  display: none;

  padding: 4px 6px;

  border-radius: 20px;

  background: #76527f;

  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 7px;

  letter-spacing: 1px;

}


.frame-choice.active
.selected-mark {

  display: block;

}


/* =====================================================
   MAIN BUTTON
===================================================== */

.main-button {

  display: block;

  width: 100%;

  max-width: 430px;

  margin: 18px auto 0;

  padding: 16px 20px;

  border: none;

  border-radius: 50px;

  background:
    #684575;

  color: white;

  font-family:
    Georgia,
    serif;

  font-size: 15px;

  letter-spacing: 1px;

  box-shadow:
    0 7px 20px
    rgba(100,60,110,0.22);

  cursor: pointer;

}


.main-button:active {

  transform:
    scale(0.98);

}


.main-button:disabled {

  opacity: .6;

}


/* =====================================================
   CAPTION AREA
===================================================== */

.caption-box {

  display: none;

  width: 100%;

  max-width: 430px;

  margin: 22px auto 0;

  padding: 18px;

  border: 1px solid
    #e0d4e2;

  border-radius: 16px;

  background:
    rgba(255,255,255,0.72);

  box-shadow:
    0 8px 25px
    rgba(70,40,75,0.07);

}


.caption-title {

  margin-bottom: 10px;

  font-size: 15px;

  color: #5b4161;

}


.caption-subtitle {

  margin-bottom: 12px;

  font-family:
    Arial,
    sans-serif;

  font-size: 10px;

  color: #9a899c;

}


#captionInput {

  width: 100%;

  min-height: 90px;

  padding: 13px 14px;

  resize: vertical;

  border: 1px solid
    #d8c9dc;

  border-radius: 11px;

  outline: none;

  background: white;

  color: #44364a;

  font-family:
    Georgia,
    serif;

  font-size: 14px;

}


#captionInput:focus {

  border-color:
    #76527f;

}


.caption-counter {

  margin-top: 5px;

  text-align: right;

  font-family:
    Arial,
    sans-serif;

  font-size: 9px;

  color: #9a899c;

}


.caption-button {

  margin-top: 10px;

}


/* =====================================================
   RESULT
===================================================== */

#result {

  display: none;

  width: 100%;

  max-width: 430px;

  margin: 25px auto 0;

}


.result-title {

  margin-bottom: 13px;

  font-family:
    Arial,
    sans-serif;

  font-size: 10px;

  letter-spacing: 3px;

  color: #806d86;

}


#photoResult {

  display: block;

  width: 100%;

  border-radius: 18px;

  box-shadow:
    0 12px 35px
    rgba(60,30,70,0.20);

}


/* =====================================================
   RESULT BUTTONS
===================================================== */

.action-button {

  width: 100%;

  max-width: 430px;

  margin: 10px auto 0;

  padding: 14px;

  border: none;

  border-radius: 12px;

  background: white;

  color: #684575;

  border: 1px solid
    #d8c9dc;

  font-family:
    Arial,
    sans-serif;

  font-size: 12px;

  letter-spacing: 1px;

  cursor: pointer;

}


.action-button.primary {

  background:
    #684575;

  border-color:
    #684575;

  color: white;

}


/* =====================================================
   CANVAS
===================================================== */

#canvas {

  display: none;

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER

<header class="header">


<div class="small-title">
Wedding Photobooth
</div>


<h1 class="names">

</h1>


<div class="date">

<!-- =====================================================

===================================================== -->

<div class="camera-wrapper">

<img

<div class="section-label">

✓

04

<div class="caption-title">

</button>

  class="action-button">

↻ &nbsp; FOTO ULANG

</button>

<canvas id="canvas"></canvas>



<script>


/* =====================================================
   ELEMENT
===================================================== */

const video =
  document.getElementById("camera");


const takePhoto =
  document.getElementById("takePhoto");


const switchCamera =
  document.getElementById("switchCamera");


const countdown =
  document.getElementById("countdown");


const canvas =
  document.getElementById("canvas");


const result =
  document.getElementById("result");


const photoResult =
  document.getElementById("photoResult");


const download =
  document.getElementById("download");


const share =
  document.getElementById("share");


const retake =
  document.getElementById("retake");


const frameOverlay =
  document.getElementById("frameOverlay");


const resolutionInfo =
  document.getElementById("resolutionInfo");


const captionBox =
  document.getElementById("captionBox");


const captionInput =
  document.getElementById("captionInput");


const captionCounter =
  document.getElementById("captionCounter");


const applyCaption =
  document.getElementById("applyCaption");


const frame1Button =
  document.getElementById("frame1Button");


const frame2Button =
  document.getElementById("frame2Button");


const frame3Button =
  document.getElementById("frame3Button");


const frame4Button =
  document.getElementById("frame4Button");


/* =====================================================
   SETTINGS
===================================================== */

let stream = null;

let facingMode = "user";

let selectedFrame =
  "frame01.png";


const FINAL_WIDTH =
  1080;


const FINAL_HEIGHT =
  1920;


/* =====================================================
   FRAME SELECTOR
===================================================== */

function selectFrame(
  frame,
  element
) {

  selectedFrame =
    frame;


  frameOverlay.src =
    frame;


  document
    .querySelectorAll(
      ".frame-choice"
    )
    .forEach(
      item => {

        item.classList.remove(
          "active"
        );

      }
    );


  element.classList.add(
    "active"
  );

}


frame1Button.onclick =
function() {

  selectFrame(
    "frame01.png",
    frame1Button
  );

};


frame2Button.onclick =
function() {

  selectFrame(
    "frame02.png",
    frame2Button
  );

};


frame3Button.onclick =
function() {

  selectFrame(
    "frame03.png",
    frame3Button
  );

};


frame4Button.onclick =
function() {

  selectFrame(
    "frame04.png",
    frame4Button
  );

};


/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {

  try {


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
              facingMode,

            width: {

              ideal: 3840

            },

            height: {

              ideal: 2160

            },

            frameRate: {

              ideal: 30

            }

          },

          audio: false

        });


    video.srcObject =
      stream;


    await video.play();


    resolutionInfo.innerText =

      video.videoWidth +
      " × " +
      video.videoHeight;


  }

  catch(error) {

    console.error(error);


    alert(
      "Kamera tidak dapat digunakan. Silakan izinkan akses kamera."
    );

  }

}


window.addEventListener(
  "load",
  startCamera
);


/* =====================================================
   SWITCH CAMERA
===================================================== */

switchCamera.onclick =
async function() {

  facingMode =

    facingMode === "user"

      ? "environment"

      : "user";


  await startCamera();

};


/* =====================================================
   COUNTDOWN
===================================================== */

takePhoto.onclick =
function() {


  let number = 3;


  takePhoto.disabled =
    true;


  countdown.style.display =
    "block";


  countdown.innerText =
    number;


  const timer =
    setInterval(
      function() {


        number--;


        if (number > 0) {

          countdown.innerText =
            number;

        }

        else {


          clearInterval(timer);


          countdown.innerText =
            "📸";


          setTimeout(
            capturePhoto,
            300
          );

        }


      },
      1000
    );

};


/* =====================================================
   CAPTURE PHOTO
===================================================== */

function capturePhoto() {


  countdown.style.display =
    "none";


  canvas.width =
    FINAL_WIDTH;


  canvas.height =
    FINAL_HEIGHT;


  const ctx =
    canvas.getContext("2d");


  /*
     Ruang caption
     tetap berada di dalam
     1080 × 1920.
  */

  const captionArea =
    270;


  const photoHeight =
    FINAL_HEIGHT -
    captionArea;


  const sourceWidth =
    video.videoWidth;


  const sourceHeight =
    video.videoHeight;


  const targetRatio =
    FINAL_WIDTH /
    photoHeight;


  let cropWidth =
    sourceWidth;


  let cropHeight =
    sourceWidth /
    targetRatio;


  if (
    cropHeight >
    sourceHeight
  ) {

    cropHeight =
      sourceHeight;


    cropWidth =
      sourceHeight *
      targetRatio;

  }


  const cropX =
    (
      sourceWidth -
      cropWidth
    ) / 2;


  const cropY =
    (
      sourceHeight -
      cropHeight
    ) / 2;


  /*
     Background
  */

  ctx.fillStyle =
    "#fffafc";


  ctx.fillRect(

    0,
    0,
    FINAL_WIDTH,
    FINAL_HEIGHT

  );


  /*
     CAMERA
  */

  ctx.drawImage(

    video,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    FINAL_WIDTH,
    photoHeight

  );


  /*
     FRAME
  */

  const frame =
    new Image();


  frame.onload =
  function() {


    ctx.drawImage(

      frame,

      0,
      0,

      FINAL_WIDTH,
      photoHeight

    );


    finishPhoto();

  };


  frame.onerror =
  function() {


    alert(
      "Frame tidak ditemukan. Pastikan nama file sama persis."
    );


    takePhoto.disabled =
      false;

  };


  frame.src =
    selectedFrame;

}


/* =====================================================
   FINISH PHOTO
===================================================== */

function finishPhoto() {


  photoResult.src =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  result.style.display =
    "block";


  captionBox.style.display =
    "block";


  takePhoto.style.display =
    "none";


  captionInput.value =
    "";


  captionCounter.innerText =
    "0";


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }

}


/* =====================================================
   CAPTION COUNTER
===================================================== */

captionInput.addEventListener(
  "input",
  function() {

    captionCounter.innerText =
      captionInput.value.length;

  }
);


/* =====================================================
   ADD CAPTION
===================================================== */

applyCaption.onclick =
function() {


  const caption =
    captionInput.value.trim();


  if (!caption) {

    alert(
      "Silakan tulis pesan terlebih dahulu."
    );

    return;

  }


  const ctx =
    canvas.getContext("2d");


  const captionArea =
    270;


  const captionStart =
    FINAL_HEIGHT -
    captionArea;


  /*
     BACKGROUND
  */

  ctx.fillStyle =
    "#fffafc";


  ctx.fillRect(

    0,

    captionStart,

    FINAL_WIDTH,

    captionArea

  );


  /*
     DIVIDER
  */

  ctx.strokeStyle =
    "#d8c5dc";


  ctx.lineWidth =
    2;


  ctx.beginPath();


  ctx.moveTo(
    70,
    captionStart + 18
  );


  ctx.lineTo(
    FINAL_WIDTH - 70,
    captionStart + 18
  );


  ctx.stroke();


  /*
     TITLE
  */

  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "#684575";


  ctx.font =
    "bold 30px Georgia";


  ctx.fillText(

    "A little note for Ginanjar & Puteri",

    FINAL_WIDTH / 2,

    captionStart + 70

  );


  /*
     MESSAGE
  */

  ctx.fillStyle =
    "#382d3d";


  ctx.font =
    "26px Georgia";


  const maxWidth =
    FINAL_WIDTH - 140;


  const words =
    caption.split(" ");


  let line = "";

  const lines = [];


  for (
    let i = 0;
    i < words.length;
    i++
  ) {


    const testLine =
      line +
      words[i] +
      " ";


    const width =
      ctx.measureText(
        testLine
      ).width;


    if (
      width > maxWidth &&
      line !== ""
    ) {


      lines.push(
        line.trim()
      );


      line =
        words[i] +
        " ";

    }

    else {

      line =
        testLine;

    }

  }


  if (line.trim()) {

    lines.push(
      line.trim()
    );

  }


  const finalLines =
    lines.slice(0,4);


  const lineHeight =
    38;


  const startY =
    captionStart + 125;


  finalLines.forEach(
    function(
      text,
      index
    ) {


      ctx.fillText(

        text,

        FINAL_WIDTH / 2,

        startY +
        (
          index *
          lineHeight
        )

      );

    }
  );


  /*
     UPDATE PREVIEW
  */

  photoResult.src =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  applyCaption.innerText =
    "✓ PESAN DITAMBAHKAN";


  setTimeout(
    function() {

      applyCaption.innerText =
        "💌  TAMBAHKAN PESAN";

    },
    2000
  );

};


/* =====================================================
   DOWNLOAD
===================================================== */

download.onclick =
function() {


  const link =
    document.createElement("a");


  link.download =
    "Ginanjar-Puteri-31082026-Story.jpg";


  link.href =
    canvas.toDataURL(
      "image/jpeg",
      1.0
    );


  link.click();

};


/* =====================================================
   SHARE / INSTAGRAM STORY
===================================================== */

share.onclick =
async function() {


  try {


    const blob =
      await new Promise(
        resolve => {

          canvas.toBlob(

            resolve,

            "image/jpeg",

            1.0

          );

        }
      );


    const file =
      new File(

        [blob],

        "Ginanjar-Puteri-31082026-Story.jpg",

        {

          type:
            "image/jpeg"

        }

      );


    if (

      navigator.canShare &&

      navigator.canShare({

        files: [file]

      })

    ) {


      await navigator.share({

        files: [file],

        title:
          "Ginanjar & Puteri",

        text:
          "Wedding Photo • 31.08.2026"

      });


    }

    else {


      alert(
        "Perangkat ini belum mendukung berbagi foto. Silakan download foto terlebih dahulu."
      );

    }


  }

  catch(error) {

    console.log(error);

  }

};


/* =====================================================
   RETAKE
===================================================== */

retake.onclick =
async function() {


  result.style.display =
    "none";


  captionBox.style.display =
    "none";


  takePhoto.style.display =
    "block";


  takePhoto.disabled =
    false;


  await startCamera();

};

</script>
