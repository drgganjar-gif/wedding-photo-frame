<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganjar & Puteri | 31.08.2026</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;

  background: #f3edf5;

  font-family: Georgia, serif;
  text-align: center;

  color: #382d3d;
}

h1 {
  margin: 5px 0;

  font-size: 25px;
  letter-spacing: 2px;
}

.subtitle {
  margin-bottom: 16px;

  font-size: 14px;
  letter-spacing: 1px;
}


/* =========================
   FRAME SELECTOR
========================= */

.frame-title {

  margin-top: 10px;
  margin-bottom: 10px;

  font-size: 14px;
  letter-spacing: 1px;
}

.frame-buttons {

  display: flex;

  justify-content: center;

  gap: 10px;

  max-width: 420px;

  margin: 0 auto 15px;
}

.frame-button {

  flex: 1;

  padding: 11px 8px;

  margin: 0;

  border-radius: 10px;

  background: white;

  color: #684575;

  border: 2px solid #d9c8df;

  box-shadow: none;

  font-size: 14px;
}

.frame-button.active {

  background: #684575;

  color: white;

  border-color: #684575;
}


/* =========================
   CAMERA
========================= */

.camera-box {

  position: relative;

  width: 100%;

  max-width: 420px;

  aspect-ratio: 9 / 16;

  margin: auto;

  background: #111;

  overflow: hidden;

  border-radius: 18px;

  box-shadow:
    0 8px 28px rgba(60,30,70,0.25);
}


#camera {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 1;
}


/* =========================
   FRAME OVERLAY
========================= */

#frameOverlay {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: fill;

  z-index: 10;

  pointer-events: none;
}


/* =========================
   SWITCH CAMERA
========================= */

#switchCamera {

  position: absolute;

  top: 24px;
  right: 24px;

  z-index: 20;

  width: 46px;
  height: 46px;

  margin: 0;
  padding: 0;

  border: none;

  border-radius: 50%;

  background:
    rgba(65,35,75,0.65);

  color: white;

  font-size: 20px;

  cursor: pointer;
}


/* =========================
   COUNTDOWN
========================= */

#countdown {

  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 30;

  font-size: 90px;

  font-weight: bold;

  color: white;

  text-shadow:
    0 3px 15px #3b1748;

  display: none;
}


/* =========================
   BUTTON
========================= */

button {

  width: 100%;

  max-width: 420px;

  margin: 12px auto 0;

  padding: 14px;

  border: none;

  border-radius: 11px;

  background: #684575;

  color: white;

  font-size: 15px;

  cursor: pointer;

  box-shadow:
    0 4px 12px rgba(80,40,90,0.2);
}

button:active {

  transform: scale(0.98);

}


/* =========================
   RESULT
========================= */

#result {

  display: none;

  width: 100%;

  max-width: 420px;

  margin: 20px auto;
}

#result img {

  width: 100%;

  border-radius: 16px;

  box-shadow:
    0 6px 22px rgba(60,30,70,0.22);
}


/* =========================
   CANVAS
========================= */

#canvas {

  display: none;
}

</style>

</head>


<body>


<h1>
Wedding Photo
</h1>


<div class="subtitle">
Ganjar & Puteri • 31.08.2026
</div>


<div class="frame-title">
Pilih Frame
</div>


<div class="frame-buttons">

  <button
    class="frame-button active"
    id="frame1Button">

    🌸 Frame 1

  </button>


  <button
    class="frame-button"
    id="frame2Button">

    💜 Frame 2

  </button>

</div>


<div class="camera-box">


  <!-- CAMERA -->

  <video
    id="camera"
    autoplay
    playsinline>
  </video>


  <!-- FRAME -->

  <img
    id="frameOverlay"
    src="Frame01.png"
    alt="Wedding Frame">


  <!-- SWITCH CAMERA -->

  <button
    id="switchCamera">

    🔄

  </button>


  <!-- COUNTDOWN -->

  <div id="countdown"></div>


</div>


<!-- TAKE PHOTO -->

<button id="takePhoto">

📸 AMBIL FOTO

</button>


<!-- RESULT -->

<div id="result">


  <img
    id="photoResult"
    alt="Hasil foto">


  <button id="download">

    ⬇️ DOWNLOAD FOTO

  </button>


  <button id="retake">

    🔄 FOTO ULANG

  </button>

</div>


<canvas id="canvas"></canvas>


<script>


/* =========================
   ELEMENT
========================= */

const video =
  document.getElementById("camera");


const takePhoto =
  document.getElementById("takePhoto");


const switchCamera =
  document.getElementById("switchCamera");


const countdown =
  document.getElementById("countdown");


const canvas =
  document.getElementById("canvas");


const result =
  document.getElementById("result");


const photoResult =
  document.getElementById("photoResult");


const download =
  document.getElementById("download");


const retake =
  document.getElementById("retake");


const frameOverlay =
  document.getElementById("frameOverlay");


const frame1Button =
  document.getElementById("frame1Button");


const frame2Button =
  document.getElementById("frame2Button");


/* =========================
   CAMERA STATE
========================= */

let stream = null;

let facingMode = "user";


/* =========================
   FRAME STATE
========================= */

let selectedFrame =
  "Frame01.png";


/* =========================
   SELECT FRAME 1
========================= */

frame1Button.onclick =
function() {

  selectedFrame =
    "Frame01.png";

  frameOverlay.src =
    selectedFrame;

  frame1Button.classList.add(
    "active"
  );

  frame2Button.classList.remove(
    "active"
  );

};


/* =========================
   SELECT FRAME 2
========================= */

frame2Button.onclick =
function() {

  selectedFrame =
    "Frame02.png";

  frameOverlay.src =
    selectedFrame;

  frame2Button.classList.add(
    "active"
  );

  frame1Button.classList.remove(
    "active"
  );

};


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            facingMode

        },

        audio: false

      });


    video.srcObject =
      stream;


  }

  catch(error) {

    console.error(error);

    alert(
      "Kamera tidak dapat digunakan. Silakan izinkan akses kamera."
    );

  }

}


/* =========================
   PAGE LOAD
========================= */

window.addEventListener(
  "load",
  startCamera
);


/* =========================
   SWITCH CAMERA
========================= */

switchCamera.onclick =
async function() {

  facingMode =
    facingMode === "user"
      ? "environment"
      : "user";


  await startCamera();

};


/* =========================
   TAKE PHOTO
========================= */

takePhoto.onclick =
function() {

  let number = 3;


  countdown.style.display =
    "block";


  countdown.innerText =
    number;


  const timer =
    setInterval(function() {


      number--;


      if(number > 0) {

        countdown.innerText =
          number;

      }


      else {

        clearInterval(timer);


        countdown.innerText =
          "📸";


        setTimeout(
          capturePhoto,
          300
        );

      }


    }, 1000);

};


/* =========================
   CAPTURE PHOTO
========================= */

function capturePhoto() {


  countdown.style.display =
    "none";


  const width = 1080;

  const height = 1920;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  /* =========================
     DRAW CAMERA
  ========================= */


  const scale =
    Math.max(

      width /
        video.videoWidth,

      height /
        video.videoHeight

    );


  const newWidth =
    video.videoWidth *
    scale;


  const newHeight =
    video.videoHeight *
    scale;


  const x =
    (width -
      newWidth) / 2;


  const y =
    (height -
      newHeight) / 2;


  ctx.drawImage(

    video,

    x,
    y,

    newWidth,
    newHeight

  );


  /* =========================
     DRAW SELECTED FRAME
  ========================= */

  const frame =
    new Image();


  frame.onload =
  function() {


    ctx.drawImage(

      frame,

      0,
      0,

      width,
      height

    );


    finishPhoto();

  };


  frame.onerror =
  function() {

    alert(
      "Frame tidak ditemukan. Pastikan Frame01.png dan Frame02.png berada satu folder dengan index.html."
    );

  };


  frame.src =
    selectedFrame;

}


/* =========================
   FINISH PHOTO
========================= */

function finishPhoto() {


  const image =
    canvas.toDataURL(

      "image/jpeg",

      0.95

    );


  photoResult.src =
    image;


  result.style.display =
    "block";


  takePhoto.style.display =
    "none";


  /* STOP CAMERA */

  if(stream) {

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

}


/* =========================
   DOWNLOAD
========================= */

download.onclick =
function() {


  const link =
    document.createElement("a");


  link.download =
    "Ganjar-Puteri-31082026.jpg";


  link.href =
    photoResult.src;


  link.click();

};


/* =========================
   RETAKE
========================= */

retake.onclick =
async function() {


  result.style.display =
    "none";


  takePhoto.style.display =
    "block";


  await startCamera();

};


</script>

</body>
</html>
