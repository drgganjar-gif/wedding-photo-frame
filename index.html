<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganjar & Puteri | 31.08.2026</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f5f1eb;
  font-family: Georgia, serif;
  text-align: center;
  color: #3d3935;
}

h1 {
  margin: 5px 0;
  font-size: 25px;
  letter-spacing: 2px;
}

.subtitle {
  margin-bottom: 18px;
  letter-spacing: 1px;
}

.camera-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 9 / 16;
  margin: auto;
  background: #000;
  overflow: hidden;
  border-radius: 14px;
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.frame {
  position: absolute;
  inset: 0;
  pointer-events: none;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;

  padding-bottom: 35px;

  background:
    linear-gradient(
      to bottom,
      transparent 65%,
      rgba(255,255,255,0.8)
    );
}

.wedding {
  font-size: 11px;
  letter-spacing: 3px;
}

.names {
  font-size: 29px;
  margin-top: 7px;
}

.date {
  font-size: 14px;
  letter-spacing: 3px;
  margin-top: 7px;
}

button {
  width: 100%;
  max-width: 420px;
  margin: 15px auto 0;
  padding: 15px;
  border: none;
  border-radius: 10px;

  background: #3d3935;
  color: white;

  font-size: 16px;
}

#countdown {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  font-size: 90px;
  font-weight: bold;

  color: white;

  text-shadow:
    0 3px 10px black;

  display: none;

  z-index: 10;
}

#result {
  display: none;

  width: 100%;
  max-width: 420px;

  margin: 20px auto;
}

#result img {
  width: 100%;
  border-radius: 14px;
}

</style>
</head>

<body>

<h1>Wedding Photo</h1>

<div class="subtitle">
Ganjar & Puteri • 31.08.2026
</div>

<div class="camera-box">

  <video
    id="camera"
    autoplay
    playsinline>
  </video>

  <div id="countdown"></div>

  <div class="frame">

    <div class="wedding">
      THE WEDDING OF
    </div>

    <div class="names">
      Ganjar & Puteri
    </div>

    <div class="date">
      31 • 08 • 2026
    </div>

  </div>

</div>

<button id="startCamera">
📸 BUKA KAMERA
</button>

<button id="takePhoto" style="display:none;">
🔴 AMBIL FOTO
</button>

<div id="result">

  <img id="photoResult">

  <button id="download">
    ⬇️ DOWNLOAD FOTO
  </button>

  <button id="retake">
    🔄 FOTO ULANG
  </button>

</div>

<canvas id="canvas" style="display:none;"></canvas>


<script>

const video =
document.getElementById("camera");

const startCamera =
document.getElementById("startCamera");

const takePhoto =
document.getElementById("takePhoto");

const countdown =
document.getElementById("countdown");

const canvas =
document.getElementById("canvas");

const result =
document.getElementById("result");

const photoResult =
document.getElementById("photoResult");

const download =
document.getElementById("download");

const retake =
document.getElementById("retake");

let stream;


// =========================
// BUKA KAMERA
// =========================

startCamera.onclick = async function() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });

    video.srcObject = stream;

    startCamera.style.display = "none";

    takePhoto.style.display = "block";

  }

  catch(error) {

    alert(
      "Kamera tidak bisa digunakan. Pastikan izin kamera diberikan kepada browser."
    );

  }

};


// =========================
// AMBIL FOTO
// =========================

takePhoto.onclick = function() {

  let number = 3;

  countdown.style.display = "block";

  countdown.innerText = number;

  const timer =
    setInterval(function() {

      number--;

      if(number > 0) {

        countdown.innerText =
          number;

      }

      else {

        clearInterval(timer);

        countdown.innerText =
          "📸";
       setTimeout(
          capturePhoto,
          300
        );

      }

    }, 1000);

};


// =========================
// CAPTURE
// =========================

function capturePhoto() {

  countdown.style.display =
    "none";

  const width =
    1080;

  const height =
    1920;

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext("2d");


  // FOTO

  const scale =
    Math.max(
      width / video.videoWidth,
      height / video.videoHeight
    );

  const newWidth =
    video.videoWidth * scale;

  const newHeight =
    video.videoHeight * scale;

  const x =
    (width - newWidth) / 2;

  const y =
    (height - newHeight) / 2;


  ctx.drawImage(
    video,
    x,
    y,
    newWidth,
    newHeight
  );


  // GRADIENT

  const gradient =
    ctx.createLinearGradient(
      0,
      1250,
      0,
      1920
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0.85)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    1100,
    width,
    820
  );


  // TEXT

  ctx.fillStyle =
    "#3d3935";

  ctx.textAlign =
    "center";


  ctx.font =
    "24px Georgia";

  ctx.fillText(
    "THE WEDDING OF",
    540,
    1650
  );


  ctx.font =
    "52px Georgia";

  ctx.fillText(
    "Ganjar & Puteri",
    540,
    1720
  );


  ctx.font =
    "25px Georgia";

  ctx.fillText(
    "31 • 08 • 2026",
    540,
    1775
  );


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.95
    );


  photoResult.src =
    image;

  result.style.display =
    "block";

  takePhoto.style.display =
    "none";


  // Matikan kamera

  if(stream) {

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }

}


// =========================
// DOWNLOAD
// =========================

download.onclick =
function() {

  const link =
    document.createElement("a");

  link.download =
    "Ganjar-Puteri-31082026.jpg";

  link.href =
    photoResult.src;

  link.click();

};


// =========================
// FOTO ULANG
// =========================

retake.onclick =
async function() {

  result.style.display =
    "none";

  try {

    stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });

    video.srcObject =
      stream;

    takePhoto.style.display =
      "block";

  }

  catch(error) {

    alert(
      "Tidak bisa membuka kamera."
    );

  }

};

</script>

</body>
</html>
